services:
  milicent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: milicent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: "0.0.0.0"
      PORT: "3001"
      MILICENT_DB_PATH: "/app/data/milicent.db"
      TZ: "Asia/Jakarta"
    ports:
      - "127.0.0.1:${PORT:-3001}:3001"
    volumes:
      - milicent_data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  milicent_data:
